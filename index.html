<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moj centralni sistem – Glasovni unos</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f1f4f8;
      color: #202b3c;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: 35px auto;
      padding: 25px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 22px #00000012;
    }

    h1 {
      text-align: center;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #687386;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
    }

    select, textarea, button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
    }

    select, textarea {
      border: 1px solid #ccd4df;
      background: white;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      font-family: Arial, sans-serif;
    }

    button {
      border: 0;
      margin-top: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .voice {
      background: #1f4e78;
      color: white;
    }

    .send {
      background: #198754;
      color: white;
    }

    #status {
      margin-top: 18px;
      padding: 13px;
      background: #f1f4f8;
      border-radius: 8px;
      text-align: center;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .help {
      margin-top: 22px;
      padding: 15px;
      background: #f5f7fa;
      border-radius: 10px;
      line-height: 1.6;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>MOJ CENTRALNI SISTEM</h1>
    <div class="subtitle">Glasovni unos podataka</div>

    <label for="language">Jezik prepoznavanja:</label>
    <select id="language">
      <option value="bs-BA" selected>Bosanski</option>
      <option value="hr-HR">Hrvatski</option>
      <option value="sr-RS">Srpski</option>
      <option value="en-US">Engleski (SAD)</option>
    </select>

    <label for="command">Prepoznati ili upisani tekst:</label>
    <textarea id="command"
      placeholder="Ovdje će se pojaviti prepoznati govor..."></textarea>

    <button class="voice" id="voiceButton" type="button"
      onclick="startVoice()">
      🎤 GOVORI
    </button>

    <button class="send" id="sendButton" type="button"
      onclick="sendCommand()">
      SAČUVAJ U GOOGLE SHEETS
    </button>

    <div id="status">Sistem je spreman.</div>

    <div class="help">
      <strong>Primjeri naredbi:</strong><br>
      Trošak 35 KM, gorivo, gotovina<br>
      Prihod 500 KM, prodaja<br>
      Zadatak: Nazvati dobavljača, rok sutra<br>
      Kontakt: Marko Marković, telefon 061123456
    </div>
  </div>

  <script>
    const APP_URL =
      "https://script.google.com/macros/s/AKfycbwxrtXitsacTQao9desfquS_mZuCK03n9F_kXpl5b0Scuv8ap6xWhkAzYnwbqqBQHvldg/exec";

    const commandBox = document.getElementById("command");
    const statusBox = document.getElementById("status");
    const voiceButton = document.getElementById("voiceButton");
    const sendButton = document.getElementById("sendButton");
    let recognition = null;
    let isListening = false;
    let textBeforeListening = "";
    let voiceError = "";

    
function startVoice() {

  // Ako mikrofon već radi, zaustavi diktiranje.
  if (isListening && recognition) {
    voiceButton.disabled = true;
    statusBox.textContent = "Završavam diktiranje...";

    recognition.stop();
    return;
  }

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    statusBox.textContent =
      "Prepoznavanje govora nije podržano u ovom pregledniku.";
    return;
  }

  textBeforeListening = commandBox.value.trim();
  voiceError = "";

  const currentRecognition = new SpeechRecognition();
  recognition = currentRecognition;

  currentRecognition.lang =
    document.getElementById("language").value;

  // Kontinuirano diktiranje
  currentRecognition.continuous = true;
  currentRecognition.interimResults = true;
  currentRecognition.maxAlternatives = 1;

  isListening = true;

  voiceButton.disabled = false;
  voiceButton.textContent = "■ ZAVRŠI DIKTIRANJE";

  statusBox.textContent =
    "Slušam... Govori svojim tempom. Možeš praviti pauze.";

  currentRecognition.onresult = function(event) {

    let transcript = "";

    for (let i = 0; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript + " ";
    }

    const currentText = transcript
      .trim()
      .replace(/\s+/g, " ");

    commandBox.value = [
      textBeforeListening,
      currentText
    ].filter(Boolean).join(" ");

    statusBox.textContent =
      "Diktiranje je aktivno. Pritisni ZAVRŠI DIKTIRANJE kada završiš.";
  };

  currentRecognition.onerror = function(event) {

    const messages = {
      "not-allowed": "Chrome nema dozvolu za mikrofon.",
      "no-speech": "Nije prepoznat govor.",
      "network": "Problem s internetskom vezom ili servisom govora.",
      "language-not-supported": "Izabrani jezik nije podržan."
    };

    voiceError = messages[event.error] ||
      "Greška prepoznavanja: " + event.error;

    statusBox.textContent = voiceError;
  };

  currentRecognition.onend = function() {

    isListening = false;
    recognition = null;

    voiceButton.disabled = false;
    voiceButton.textContent = "🎤 NASTAVI DIKTIRANJE";

    if (voiceError) {
      statusBox.textContent = voiceError;
    } else if (commandBox.value.trim()) {
      statusBox.textContent =
        "Diktiranje je završeno. Provjeri tekst prije spremanja.";
    } else {
      statusBox.textContent =
        "Nije prepoznat tekst. Pokušaj ponovo.";
    }
  };

  try {
    currentRecognition.start();
  } catch (error) {
    isListening = false;
    recognition = null;
    voiceButton.textContent = "🎤 GOVORI";

    statusBox.textContent =
      "Nije moguće pokrenuti mikrofon: " + error.message;
  }
}


    function sendCommand() {
      const command = commandBox.value.trim();

      if (!command) {
        statusBox.textContent =
          "Prvo izgovori ili upiši naredbu.";
        return;
      }

      statusBox.textContent =
        "Šaljem podatke u Google Sheets...";

      sendButton.disabled = true;

      const form = document.createElement("form");
      form.method = "POST";
      form.action = APP_URL;
      form.target = "_self";

      const fields = {
        command: command,
        requestId: (
          window.crypto && crypto.randomUUID
            ? crypto.randomUUID()
            : Date.now() + "-" + Math.random().toString(36).slice(2)
        )
      };

      Object.entries(fields).forEach(([name, value]) => {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = name;
        input.value = value;
        form.appendChild(input);
      });

      document.body.appendChild(form);
      form.submit();
    }
  </script>
</body>
</html>
